# 开发用 PostgreSQL 18（仅本地开发；生产用 deploy/compose.yaml，密钥走环境变量）
# 默认使用共享栈 ~/workspace/env 的 env-postgres(5432)；本文件是无共享栈环境的回退，宿主端口 5433。
services:
  postgres:
    image: postgres:18
    container_name: tiangong-postgres-dev
    environment:
      POSTGRES_DB: tiangong
      POSTGRES_USER: tiangong
      POSTGRES_PASSWORD: tiangong_dev
    ports:
      - '5433:5432' # 避让共享栈 env-postgres(5432)
    volumes:
      # pg18 官方镜像约定：挂载父目录，数据实际落在 /var/lib/postgresql/18/docker
      - tiangong_pg_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiangong -d tiangong']
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  tiangong_pg_dev:

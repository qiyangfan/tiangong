# 天工全栈部署（PostgreSQL 18 + api + web nginx 反代）
# 生产/CI 侧覆盖敏感值：JWT_ACCESS_SECRET、ADMIN_INITIAL_PASSWORD、CORS_ORIGINS 用 .env 或编排层注入；
# 本文件内的默认值仅为本地演示哑值，禁止用于真实环境。
name: tiangong

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tiangong
      POSTGRES_USER: tiangong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_change_me_app}
    volumes:
      # pg18 官方镜像约定：挂载父目录，数据实际落在 /var/lib/postgresql/18/docker
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tiangong -d tiangong']
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://tiangong:${POSTGRES_PASSWORD:-tg_change_me_app}@postgres:5432/tiangong
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be provided (>=32 chars)}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      NODE_ENV: production
    volumes:
      # 文件上传需要可写目录；容器根文件系统只读
      - api-storage:/app/storage
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/live']
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      # 宿主机端口不变；容器内为 unprivileged nginx 的 8080
      - '8080:8080'
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
  api-storage:

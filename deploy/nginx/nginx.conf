server {
    listen 8080;
    server_name _;

    # 安全响应头：SPA 同源资源 + EP/Vue 运行时注入的内联样式
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由：静态资源不存在时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 同源反代（web 构建产物以 /api/v1 为基地址）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # swagger 文档反代
    location /docs {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
}

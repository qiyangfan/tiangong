name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新推送取消旧跑；最小权限只读
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-26.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: tiangong_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci_pw
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -proot -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DATABASE_URL: mysql://ci:ci_pw@localhost:3306/tiangong_test
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_chars_long
      ADMIN_INITIAL_PASSWORD: CiAdmin#Initial1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6 # version 省略，读 package.json packageManager 单源
      - uses: actions/setup-node@v5
        with:
          # 与 engines.node (>=24) / mise.toml 对齐；24 为当前 LTS
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @tiangong/api test:integration
      - run: pnpm build

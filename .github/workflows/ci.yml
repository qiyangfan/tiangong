name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同分支新推送取消旧跑；最小权限只读
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  images:
    # 镜像构建独立成 job 并行跑：只验证 Dockerfile 与构建上下文可用，不起容器
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # compose 解析期做变量插值，必填项缺失会在 build 前直接报错
      JWT_ACCESS_SECRET: ci_image_build_secret_at_least_32_chars
      # 显式哑值：避免 seed 走「未设置 → 随机生成并打印口令」分支把凭据写进日志
      ADMIN_INITIAL_PASSWORD: ci_image_build_admin_pw
    steps:
      - uses: actions/checkout@v7
      - name: 安装 hadolint
        run: |
          VERSION=2.15.1
          curl -sSfL "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint
      - name: Dockerfile lint
        run: hadolint apps/api/Dockerfile apps/web/Dockerfile
      - name: 构建镜像
        run: docker compose -f deploy/compose.yaml build
      - name: 安装 trivy
        run: |
          VERSION=0.76.2
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
      # 只拦有修复版本的 HIGH/CRITICAL；无修复项进 .trivyignore 并写理由
      - name: 镜像漏洞扫描
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 tiangong-api:latest
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 tiangong-web:latest
      # 以真实部署形态（只读根文件系统 + 降权 + 安全头）做一次全栈冒烟
      - name: 全栈冒烟与安全响应头
        run: |
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 180
          node scripts/check-headers.mjs http://127.0.0.1:8080/
      - name: 停止全栈
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  quality:
    # 26.04 标签在当前账号不可用（启动期 startup_failure，0 jobs 物化）；钉 24.04 LTS 确定可用
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tiangong_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_pw
        ports:
          - '5432:5432'
        options: >-
          --health-cmd="pg_isready -U ci -d tiangong_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      # 集成与 e2e 统一经 TEST_DATABASE_URL 指向 postgres service（两套套件内部约定同名字段）
      TEST_DATABASE_URL: postgresql://ci:ci_pw@localhost:5432/tiangong_test
      DATABASE_URL: postgresql://ci:ci_pw@localhost:5432/tiangong_test
      # schema 与迁移目录漂移检查用的空库（下方步骤创建）
      SHADOW_DATABASE_URL: postgresql://ci:ci_pw@localhost:5432/tiangong_shadow
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_chars_long
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version 省略，读 package.json packageManager 单源
      - uses: actions/setup-node@v5
        with:
          # 与 engines.node (>=24) / mise.toml 对齐；24 为当前 LTS
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # spec 层是 agent 改动的输入：规格/变更 delta 结构错误在这里阻断
      - name: OpenSpec 规格校验
        run: pnpm spec:validate
      - name: Prisma schema 校验
        run: pnpm schema:validate
      - run: pnpm schema:format:check
      - name: 创建迁移影子库
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U ci -d postgres -c
          "CREATE DATABASE tiangong_shadow;"
      - name: schema 与迁移漂移检查
        run: pnpm schema:drift
      - run: pnpm lint
      - run: pnpm lint:arch
      - run: pnpm lint:style
      - run: pnpm lint:md
      - run: pnpm docs:links
      # 重复率基线 3.62%（2026-11-19），阈值 4% 防回退
      - run: pnpm dup:check
      # 死代码/未用依赖与导出：knip 已清零，按阻断执行；miniapp 因 uni 自动导入暂排除
      - run: pnpm lint:dead
      - run: pnpm format:check
      # contracts 的类型产物是 typecheck/test 的解析前提，先构建（拓扑保证 contracts 先行）
      - run: pnpm build
      # 产物体积预算：web gzip 总量 + 微信小程序主包原始字节（主包硬限 2MB）
      - run: pnpm size:check
      - run: pnpm typecheck
      # 覆盖率口径：api 含单元 + 集成（下方不再单跑集成），其余包为单测
      - run: pnpm test:coverage
      - run: pnpm --filter @tiangong/e2e exec playwright install --with-deps chromium
      # e2e 插桩统计 web 全 src 覆盖率（默认 e2e 路径不含探针）
      - run: pnpm --filter @tiangong/e2e test:e2e:coverage
      - name: 上传 e2e 失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

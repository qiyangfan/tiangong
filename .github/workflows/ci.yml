name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: tiangong_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci_pw
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -proot -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      DATABASE_URL: mysql://ci:ci_pw@localhost:3306/tiangong_test
      JWT_ACCESS_SECRET: ci_access_secret_at_least_32_chars_long
      JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_chars_long
      ADMIN_INITIAL_PASSWORD: CiAdmin#Initial1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

name: security

on:
  push:
    branches: [main]
  pull_request:

# 同分支新推送取消旧跑；最小权限只读
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    # 与 ci.yml 同口径钉 24.04：26.04 标签在当前账号不可用（启动期 startup_failure）
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 全量历史扫描：只扫工作树会漏掉历史提交中的机密
          fetch-depth: 0
      - name: gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version 省略，读 package.json packageManager 单源
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 全量依赖（含 dev 工具链）；豁免项与理由集中在 pnpm-workspace.yaml 的 auditConfig
      - name: 依赖漏洞审计
        run: pnpm audit --audit-level=high
      - name: 许可证合规
        run: pnpm license:check
      - name: SBOM 生成
        run: pnpm sbom:generate
      - name: 上传 SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 7

  # 锁定文件漏洞扫描：pnpm audit 之外的完整依赖图，覆盖 lockfile 中未被当前安装的版本。
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: osv-scanner
        run: |
          VERSION=2.7.1
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64" \
            -o ./osv-scanner
          chmod +x ./osv-scanner
          ./osv-scanner scan source -r .

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: 安装 shellcheck
        # actionlint 检测到 shellcheck 才会分析 run: 块里的内联 shell，未装时整块静默跳过
        run: |
          VERSION=0.11.0
          curl -sSfL "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          install /tmp/shellcheck-v${VERSION}/shellcheck /usr/local/bin/shellcheck
      - name: actionlint
        run: |
          VERSION=1.7.12
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -color
